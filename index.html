<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Saver - Save and Organize Your Content</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <i class="fas fa-bookmark"></i>
                Content Saver
            </h1>
            <p class="tagline">Save, organize, and manage your favorite content</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- Add Content Form -->
            <section class="add-content-section">
                <div class="form-container">
                    <h2>Add New Content</h2>
                    <form id="contentForm" class="content-form">
                        <div class="form-group">
                            <label for="contentUrl">URL or Content</label>
                            <input type="text" id="contentUrl" placeholder="Enter URL or paste content..." required>
                        </div>
                        <div class="form-group">
                            <label for="contentTitle">Title</label>
                            <input type="text" id="contentTitle" placeholder="Enter title (optional)">
                        </div>
                        <div class="form-group">
                            <label for="contentDescription">Description</label>
                            <textarea id="contentDescription" placeholder="Add description (optional)" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="contentTags">Tags</label>
                            <input type="text" id="contentTags" placeholder="Enter tags separated by commas">
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i>
                            Save Content
                        </button>
                    </form>
                </div>
            </section>

            <!-- Search and Filter -->
            <section class="search-section">
                <div class="search-container">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search your saved content...">
                    </div>
                    <div class="filter-options">
                        <select id="sortBy">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="title">Title A-Z</option>
                        </select>
                        <button id="clearAll" class="btn btn-secondary">
                            <i class="fas fa-trash"></i>
                            Clear All
                        </button>
                    </div>
                </div>
            </section>

            <!-- Saved Content List -->
            <section class="content-list-section">
                <div class="content-header">
                    <h2>Saved Content</h2>
                    <span id="contentCount" class="content-count">0 items</span>
                </div>
                <div id="contentList" class="content-list">
                    <!-- Saved content items will be displayed here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-bookmark"></i>
                    <h3>No content saved yet</h3>
                    <p>Start by adding your first URL or content above</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Content Saver. Made with <i class="fas fa-heart"></i> for organizing content.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
